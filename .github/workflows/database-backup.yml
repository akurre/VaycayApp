name: Database Backup

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read

jobs:
  backup:
    name: Backup Production Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install PostgreSQL client
        run: |
          sudo apt-get install -y curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          sudo sh -c 'echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Create Database Backup
        run: |
          # Create backup directory
          mkdir -p backups

          # Generate backup filename with timestamp
          BACKUP_FILE="backups/backup-$(date +%Y-%m-%d-%H%M%S).sql"

          # Create database dump using public URL (internal URL not reachable from GitHub Actions)
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.DATABASE_PUBLIC_URL }}" > "$BACKUP_FILE"

          # Compress the backup
          gzip "$BACKUP_FILE"

          echo "✅ Backup created: ${BACKUP_FILE}.gz"
          ls -lh backups/

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: backups/*.sql.gz
          retention-days: 30
          if-no-files-found: error

      - name: Backup Summary
        run: |
          echo "✅ Database backup completed successfully"
          echo "📦 Backup stored in GitHub Artifacts (retained for 30 days)"
          echo "💡 To restore: Download the artifact and run 'railway run --service backend psql < backup.sql'"

      # Optional: Upload to S3 for longer retention
      # Uncomment and configure if you want to store backups in AWS S3
      # - name: Upload to S3
      #   if: success()
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     AWS_REGION: us-east-1
      #   run: |
      #     aws s3 cp backups/ s3://your-backup-bucket/vaycay-backups/ --recursive
