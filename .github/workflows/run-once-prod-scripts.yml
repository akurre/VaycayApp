name: Run One-Off Production Scripts (Self-Deleting)

# Runs three one-off scripts against the production database, then deletes
# itself so it can't run twice. Triggers on successful completion of the
# Deploy to Railway Production workflow on master, so deploys + migrations
# finish first.
#
# To re-arm: restore this file from git history and push to master.

on:
  workflow_run:
    workflows: ['Deploy to Railway Production']
    types: [completed]
    branches: [master]

permissions:
  contents: write

concurrency:
  group: run-once-prod-scripts
  cancel-in-progress: false

jobs:
  run-once:
    name: Run one-off scripts and self-delete
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run add-city-sunshine.ts
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd server
          railway run --service=backend npx tsx scripts/add-city-sunshine.ts

      - name: Run update-missing-populations.ts --repair
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd server
          railway run --service=backend -- \
            npx ts-node --project tsconfig.json scripts/update-missing-populations.ts --repair

      - name: Run aggregate-weekly-weather.ts
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd server
          railway run --service=backend npx tsx scripts/aggregate-weekly-weather.ts

      - name: Self-delete workflow file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/run-once-prod-scripts.yml
          git commit -m "chore: remove one-shot prod-scripts workflow after successful run"
          git push origin master
